# config-defaults-60-20.yaml
# on

experiment_tag:
  desc: "Tag for the experiment to differentiate configurations"
  value: "60_20__5hp"

train_corpora:
  desc: "Training corpora configurations"
  value:
    - dataset: "data/chall_mt/unprocessed/chall_dataset_second_split_v0"
      split: "train"
      load_from_disk: true
      target_duration_hours: 60
    - dataset: "data/chall_mt/processed/f5_synth_stt_dataset_v1"
      split: "train"
      load_from_disk: true
      target_duration_hours: 20

eval_corpora:
  desc: "Evaluation corpora configurations"
  value:
    - dataset: "data/chall_mt/unprocessed/chall_dataset_second_split_v0"
      split: "eval"
      load_from_disk: true

train_args:
  desc: "Training arguments for 2 GPUS p_gpu_high_end"
  value:
    num_train_epochs: 150
    max_steps: -1
    batch_size: 30
    gradient_accumulation_steps: 21