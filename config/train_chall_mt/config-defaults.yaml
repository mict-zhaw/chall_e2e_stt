# config-defaults.yaml

experiment_name:
  desc: "Name of the experiment"
  value: "chall_mt_train"

experiment_tag:
  desc: "Tag for the experiment to differentiate configurations"
  value: "default"

seed:
  desc: "Random seed for reproducibility"
  value: 123

device:
  desc: "Device to run the training on, e.g., 'cuda' or 'cpu'"
  value: "cuda"

eval_corpora:
  desc: "Evaluation corpora configurations"
  value:
    - dataset: "data/chall_mt/unprocessed/chall_dataset_v0"
      split: "eval"
      load_from_disk: true

wav2vec_base_model:
  desc: "Desc"
  value: "facebook/wav2vec2-xls-r-300m"

checkpoint:
  desc: "Path to a pre-trained model checkpoint to resume training."
  value: null

train_args:
  desc: "Training arguments"
  value:
    num_train_epochs: 250
    max_steps: 1800
    batch_size: 17
    gradient_accumulation_steps: 19
    eval_batch_size: 1
    gradient_checkpointing: false
    learning_rate: 1e-4 # = 0.0001
    warmup_steps: 400
    label_smoothing_factor: 0.0
    fp16: false
    bf16: true
    optim: "adamw_hf"
    freeze_w2vm: false

    save_total_limit: 2
    validation_freq: 50
    save_step: 100
    logging_step: 20
