# config-defaults-60-0-4gpus.yaml

experiment_tag:
  desc: "Tag for the experiment to differentiate configurations"
  value: "60_0"

train_corpora:
  desc: "Training corpora configurations"
  value:
    - dataset: "data/chall_mt/unprocessed/chall_dataset_v0"
      split: "train"
      load_from_disk: true
      target_duration_hours: 60
    - dataset: "data/chall_mt/processed/f5_synth_stt_dataset_v1"
      split: "train"
      load_from_disk: true
      target_duration_hours: 0

train_args:
  desc: "Training arguments for two gpus. 16*40*2=1280"
  value:
    batch_size: 16
    gradient_accumulation_steps: 40
